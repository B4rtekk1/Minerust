[package]
name = "minerust"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
incremental = false

[dependencies]
directories = "6.0.0"
wgpu = "30.0.1"
winit = "0.29"
inventory = "0.3.22"
pollster = "1.0.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
glam = { version = "0.33.6", features = ["bytemuck", "serde"] }
chrono = "0.4.45"
glyphon = "0.12.0"
image = "0.25.10"
sysinfo = "0.38.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
clap = { version = "4.4", features = ["derive"] }
fastnoise-lite = "1.1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rustc-hash = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
num_cpus = "1.16"
once_cell = "1.21.4"
lazy_static = "1.5.0"
rand = "0.10.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
