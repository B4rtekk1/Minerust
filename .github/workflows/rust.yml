  name: Release

  on:
    push:
      tags:
        - 'v*'

  permissions:
    contents: write

  jobs:
    build-windows:
      name: Build Windows Release

      runs-on: windows-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Rust (stable)
          uses: dtolnay/rust-toolchain@stable
          with:
            targets: x86_64-pc-windows-msvc

        - name: Cache Cargo dependencies
          uses: Swatinem/rust-cache@v2

        - name: Build release
          run: cargo build --release --target x86_64-pc-windows-msvc

        - name: Package ZIP
          shell: pwsh
          run: |
            $out = "Minerust-windows"
            New-Item -ItemType Directory -Force -Path $out
  
            # Copy exe
            Copy-Item "target\x86_64-pc-windows-msvc\release\Minerust.exe" "$out\"
  
            # Copy assets
            Copy-Item -Recurse "assets" "$out\"
  
            # Create ZIP archive
            Compress-Archive -Path "$out\*" -DestinationPath "Minerust-windows.zip" -Force

        - name: Upload Windows package
          uses: actions/upload-artifact@v4
          with:
            name: Minerust-windows
            path: Minerust-windows.zip
            if-no-files-found: error

    build-linux:
      name: Build Linux Release

      runs-on: ubuntu-24.04

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Linux build dependencies
          run: |
            sudo apt-get update
            sudo apt-get install --yes pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libasound2-dev

        - name: Install Rust (stable)
          uses: dtolnay/rust-toolchain@stable

        - name: Cache Cargo dependencies
          uses: Swatinem/rust-cache@v2

        - name: Build release
          run: cargo build --release

        - name: Package tarball
          run: |
            mkdir -p Minerust-linux
            cp target/release/minerust Minerust-linux/
            cp -R assets Minerust-linux/
            tar -czf Minerust-linux.tar.gz Minerust-linux

        - name: Upload Linux package
          uses: actions/upload-artifact@v4
          with:
            name: Minerust-linux
            path: Minerust-linux.tar.gz
            if-no-files-found: error

    publish-release:
      name: Publish GitHub Release
      needs: [build-windows, build-linux]
      runs-on: ubuntu-latest

      steps:
        - name: Download release packages
          uses: actions/download-artifact@v4
          with:
            path: release-files
            merge-multiple: true

        - name: Create GitHub Release and upload files
          if: startsWith(github.ref, 'refs/tags/')
          uses: softprops/action-gh-release@v2
          with:
            files: |
              release-files/Minerust-windows.zip
              release-files/Minerust-linux.tar.gz
            generate_release_notes: false
